name: Build Windows & Web

on:
  workflow_dispatch: # 允许手动点按钮
  workflow_call:     # 允许被调用

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.5"
  VERSION: "1.4.4"
  TAG_NAME: "nightly"
  UPLOAD_ARTIFACT: "true"
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      # =========================================================
      # 终极修正：下载官方 Tag ZIP (100% 可用)
      # =========================================================

      # 1. 显式设置环境变量
      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $GITHUB_ENV
        shell: bash

      # 2. 安装 NASM
      - name: Install NASM
        run: choco install nasm -y

      # 3. 下载 2023.10.19 官方 Tag
      - name: Setup Vcpkg (Download Tag Zip)
        shell: powershell
        run: |
          # 使用官方 Tag 链接，这是永久有效的
          $url = "https://github.com/microsoft/vcpkg/archive/refs/tags/2023.10.19.zip"
          
          Write-Host "Removing old vcpkg if exists..."
          if (Test-Path vcpkg) { Remove-Item -Path vcpkg -Recurse -Force }
          
          Write-Host "Downloading vcpkg tag 2023.10.19..."
          Invoke-WebRequest -Uri $url -OutFile "vcpkg.zip"
          
          Write-Host "Extracting..."
          Expand-Archive -Path "vcpkg.zip" -DestinationPath "."
          
          # GitHub Tag 解压后的文件夹通常叫 vcpkg-2023.10.19
          # 我们脚本自动找到它并重命名为 vcpkg
          $extractedFolder = Get-ChildItem -Path . -Filter "vcpkg-*" | Select-Object -First 1
          Rename-Item -Path $extractedFolder.FullName -NewName "vcpkg"
          
          # 进入目录检查
          Set-Location vcpkg
          
          if (!(Test-Path "ports/libmfx")) {
            Write-Error "FATAL: libmfx directory missing in this tag!"
            exit 1
          } else {
            Write-Host "SUCCESS: libmfx port found."
          }
          
          Write-Host "Bootstrapping..."
          .\bootstrap-vcpkg.bat

      # 4. 安装依赖 (使用 libmfx)
      - name: Install vcpkg deps
        shell: bash
        run: |
          rm -f vcpkg.json
          
          # 安装 (包名使用 libmfx)
          $VCPKG_ROOT/vcpkg install libvpx libyuv opus aom ffmpeg libmfx --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed" --recurse --classic
          
          # 验证
          if [ ! -f "$VCPKG_ROOT/installed/x64-windows-static/lib/libmfx.lib" ]; then
             echo "Error: libmfx.lib not found!"
             exit 1
          fi

      # =========================================================
      # 编译与打包
      # =========================================================

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri
