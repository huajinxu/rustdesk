name: Build Windows & Web

on:
  workflow_dispatch: # 允许手动点按钮
  workflow_call:     # 允许被调用

# =========================================================
# 关键设置：赋予 GITHUB_TOKEN 写权限，否则无法发布 Release
# =========================================================
permissions:
  contents: write

env:
  # === 核心变量 ===
  FLUTTER_VERSION: "3.24.5"
  VERSION: "1.4.4"
  TAG_NAME: "nightly"  # 固定发布到 nightly 标签
  UPLOAD_ARTIFACT: "true"
  
  # === 依赖库版本 ===
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  # VCPKG设置
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "81c0029b3529369d120a104085600c7104a3e20e"

jobs:
  # Job 1: 桥接代码
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  # Job 2: Windows 依赖
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    strategy:
      fail-fast: false

  # Job 3: 编译 Windows EXE/MSI
  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          # 写死 target 避免 matrix 参数传递问题
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      # =========================================================
      # 关键修正区域：VCPKG 环境配置
      # =========================================================
      
      # =========================================================
      # 终极修正：VCPKG 环境配置
      # =========================================================
      
      # 1. 显式设置 VCPKG_ROOT 环境变量
      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $GITHUB_ENV
        shell: bash

      # 2. 安装 NASM
      - name: Install NASM
        run: choco install nasm -y

      # 3. 下载 vcpkg (不指定 ref，下载完整历史)
      # 必须 fetch-depth: 0，否则无法在下一步切换到指定 commit
      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0  

      # 4. 手动切换到 2024年的 Commit 并初始化
      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          cd vcpkg
          echo "Switching to commit ${{ env.VCPKG_COMMIT_ID }}..."
          git checkout ${{ env.VCPKG_COMMIT_ID }}
          
          echo "Bootstrapping vcpkg..."
          bootstrap-vcpkg.bat

      # 5. 安装依赖 (使用 2024年正确的包名: libmfx)
      - name: Install vcpkg deps
        shell: bash
        run: |
          # 2024年的 vcpkg 中，intel-media-sdk 已改名为 libmfx
          # 必须使用 --classic 绕过 manifest 模式
          $VCPKG_ROOT/vcpkg install libvpx libyuv opus aom ffmpeg libmfx --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed" --recurse --classic
          
          # 验证安装结果
          if [ ! -f "$VCPKG_ROOT/installed/x64-windows-static/lib/libmfx.lib" ]; then
             echo "Error: libmfx.lib not found!"
             exit 1
          fi

      # =========================================================
      # 编译与打包
      # =========================================================

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
            mkdir ./rustdesk/drivers
            mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
            Expand-Archive printer_driver_adapter.zip -DestinationPath .
            mv -Force .\printer_driver_adapter.dll ./rustdesk
          } catch { Write-Host "Ignore driver error" }

      - name: Check Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow
        uses: actions/download-artifact@master
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      - name: Generate PORTABLE EXE
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          # 简化文件名，防止参数替换错误
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      - uses: microsoft/setup-msbuild@v2

      - name: Build MSI
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi

      - name: Publish Windows
        uses: softprops/action-gh-release@v1
        with:
          # 强制指定 tag_name，如果不存在会自动创建 draft
          tag_name: nightly
          prerelease: true
          files: |
            ./SignOutput/*.msi
            ./SignOutput/*.exe

  # Job 4: 编译 Web 客户端
  build-rustdesk-web:
    name: Build Web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        shell: bash
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Build web
        shell: bash
        run: |
          cd flutter
          flutter create . --platforms web --project-name rustdesk
          
          cd web
          echo "Downloading web assets..."
          wget -q https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar xzf web_deps.tar.gz || echo "Extract warning"
          cd ..
          
          echo "Building..."
          flutter build web --release --web-renderer canvaskit --no-tree-shake-icons

          cd build
          echo "RustDesk Web Client" > web/README.md
          
          PKG_NAME="rustdesk-${{ env.VERSION }}-web-basic"
          mv web "$PKG_NAME"
          tar czf "$PKG_NAME.tar.gz" "$PKG_NAME"
          mv "$PKG_NAME.tar.gz" $GITHUB_WORKSPACE/

      - name: Publish Web
        uses: softprops/action-gh-release@v1
        with:
          # 强制指定 tag_name
          tag_name: nightly
          prerelease: true
          files: |
            *.tar.gz
