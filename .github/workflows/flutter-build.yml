name: Build Windows & Web

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.5"
  VERSION: "1.4.4"
  TAG_NAME: "nightly"
  UPLOAD_ARTIFACT: "true"
  
  # === 依赖库版本 ===
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  # Job 1: 桥接代码
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  # Job 2: Windows 依赖
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    strategy:
      fail-fast: false

  # Job 3: 编译 Windows EXE/MSI (修复了 cl.exe 错误)
  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      # === 关键修复: 安装 NASM 和 MSVC 环境 ===
      - uses: ilammy/setup-nasm@v1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter doctor -v
          flutter precache --windows
          
          Write-Host "Downloading Custom Engine..."
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          
          $flutterPath = (Get-Command flutter).Source
          $flutterRoot = Split-Path (Split-Path $flutterPath -Parent) -Parent
          $engineCachePath = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          
          Write-Host "Overwriting Engine at: $engineCachePath"
          Copy-Item -Path "windows-x64-release\*" -Destination $engineCachePath -Recurse -Force

      - name: Patch flutter
        shell: bash
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == "${{env.FLUTTER_VERSION}}" ]]; then
             cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_DIR"
             cd "$FLUTTER_DIR"
             git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || echo "Patch failed or already applied"
          fi

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg deps
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            echo "vcpkg install failed"
            exit 1
          fi

      - name: Build rustdesk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:VCPKG_ROOT = "C:\vcpkg"
          
          # 运行构建
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          
          # 移动构建产物
          Move-Item -Path ./flutter/build/windows/x64/runner/Release -Destination ./rustdesk -Force
          
          # 下载 USBMMIDD
          Write-Host "Downloading usbmmidd..."
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          Move-Item -Path .\usbmmidd_v2 -Destination ./rustdesk -Force
          
          # 下载打印机驱动
          try {
            Write-Host "Downloading Printer Drivers..."
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            
            Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
            New-Item -ItemType Directory -Force -Path ./rustdesk/drivers
            Move-Item -Path .\rustdesk_printer_driver_v4-1.4 -Destination ./rustdesk/drivers/RustDeskPrinterDriver -Force
            
            Expand-Archive printer_driver_adapter.zip -DestinationPath .
            Move-Item -Path .\printer_driver_adapter.dll -Destination ./rustdesk -Force
          } catch {
            Write-Warning "Driver download failed, skipping drivers. Error: $_"
          }

      - name: Check Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      - name: Generate PORTABLE EXE
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      - uses: microsoft/setup-msbuild@v2

      - name: Build MSI
        shell: pwsh
        run: |
          Push-Location ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          Pop-Location
          Move-Item -Path ./res/msi/Package/bin/x64/Release/en-us/Package.msi -Destination ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi -Force

      - name: Publish Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          files: |
            ./SignOutput/*.msi
            ./SignOutput/*.exe

  # Job 4: 编译 Web 客户端
  build-rustdesk-web:
    name: Build Web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        shell: bash
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == "${{env.FLUTTER_VERSION}}" ]]; then
             cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_DIR"
             cd "$FLUTTER_DIR"
             git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Build web
        shell: bash
        run: |
          cd flutter
          flutter create . --platforms web --project-name rustdesk
          
          cd web
          echo "Downloading web assets..."
          wget -q https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar xzf web_deps.tar.gz || echo "Extract warning"
          cd ..
          
          echo "Building..."
          flutter build web --release --web-renderer canvaskit --no-tree-shake-icons

          cd build
          echo "RustDesk Web Client" > web/README.md
          
          PKG_NAME="rustdesk-${{ env.VERSION }}-web-basic"
          mv web "$PKG_NAME"
          tar czf "$PKG_NAME.tar.gz" "$PKG_NAME"
          mv "$PKG_NAME.tar.gz" $GITHUB_WORKSPACE/

      - name: Publish Web
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          files: |
            *.tar.gz
