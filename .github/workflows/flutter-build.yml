name: Build Windows & Web

on:
  workflow_dispatch: # 手动触发
  workflow_call:     # 被其他流程调用

# 赋予 GITHUB_TOKEN 写权限
permissions:
  contents: write

env:
  # === 核心配置 ===
  FLUTTER_VERSION: "3.24.5"
  VERSION: "1.4.4"
  TAG_NAME: "nightly"
  UPLOAD_ARTIFACT: "true"
  
  # === 依赖库版本 ===
  LLVM_VERSION: "15.0.6"
  SCITER_RUST_VERSION: "1.75"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  # Job 1: 桥接代码
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  # Job 2: Windows 依赖
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  # Job 3: 编译 Windows EXE/MSI
  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install flutter rust bridge deps
        run: |
          dart pub global activate ffigen --version 5.0.1
          $exists = Test-Path ~/.cargo/bin/flutter_rust_bridge_codegen.exe
          if (-not $exists) {
            cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --force
          }
        shell: powershell

      - name: Patch Flutter (if needed)
        shell: bash
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "${{ env.FLUTTER_VERSION }}" == "3.24.5" ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true
          fi

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          cd $VCPKG_ROOT
          
          # 先安装 manifest 中的依赖
          echo "Installing dependencies from vcpkg.json..."
          ./vcpkg install --triplet x64-windows-static || true
          
          # 安装所有必需的编解码库
          echo "Installing codec libraries..."
          ./vcpkg install \
            libvpx:x64-windows-static \
            opus:x64-windows-static \
            ffmpeg:x64-windows-static \
            libyuv:x64-windows-static \
            aom:x64-windows-static \
            --recurse
          
          # 验证关键头文件
          echo "Verifying installed packages..."
          ls -la installed/x64-windows-static/include/vpx/ || echo "⚠️ libvpx not found"
          ls -la installed/x64-windows-static/include/opus/ || echo "⚠️ opus not found"
          ls -la installed/x64-windows-static/include/libavutil/ || echo "⚠️ FFmpeg not found"

      - name: Build rustdesk
        shell: bash
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          python3 res/inline-sciter.py
          # 移除 vram 特性以避免 hwcodec/libmfx 依赖
          cargo build --features inline,flutter --release --bins

      - name: Download RustDeskTempTopMostWindow
        uses: actions/download-artifact@master
        with:
          name: topmostwindow-artifacts
          path: ./target/release

      - name: Prepare portable packer files
        shell: bash
        run: |
          # 移除 dpiAware
          sed -i '/dpiAware/d' res/manifest.xml
          
          # 创建 rustdesk 目录并复制文件
          mkdir -p rustdesk
          cp target/release/rustdesk.exe rustdesk/
          cp target/release/WindowInjection.dll rustdesk/ || echo "WindowInjection.dll not found, skipping"
          
          # 生成 portable 所需文件
          pushd libs/portable
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd

      - name: Build rustdesk portable packer
        shell: bash
        run: |
          pushd libs/portable
          cargo build --release
          popd
          
          # 移动生成的 portable exe
          mkdir -p SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      - uses: microsoft/setup-msbuild@v2

      - name: Build MSI
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: bash
        run: |
          # 进入 MSI 目录并构建
          pushd res/msi
          
          # 使用 -c 跳过从 exe 读取元数据，手动指定所有参数
          python preprocess.py -c \
            -v ${{ env.VERSION }} \
            --app-name "RustDesk" \
            -m "RustDesk" \
            --revision-version 0
          
          # 恢复并构建 MSI
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          
          # 移动生成的 MSI
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi
          popd

      - name: Publish Windows artifacts
        uses: softprops/action-gh-release@v1
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          tag_name: ${{ env.TAG_NAME }}
          prerelease: true
          files: |
            SignOutput/*.msi
            SignOutput/*.exe

  # Job 4: 编译 Web 客户端
  build-rustdesk-web:
    name: Build Web
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web
        shell: bash
        run: |
          cd flutter
          flutter create . --platforms web --project-name rustdesk
          
          cd web
          echo "Downloading web assets..."
          wget -q https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar xzf web_deps.tar.gz || echo "Extract warning"
          
          cd ..
          echo "Building web client..."
          flutter build web --release --web-renderer canvaskit --no-tree-shake-icons
          
          cd build
          echo "RustDesk Web Client v${{ env.VERSION }}" > web/README.md
          PKG_NAME="rustdesk-${{ env.VERSION }}-web-basic"
          mv web "$PKG_NAME"
          tar czf "$PKG_NAME.tar.gz" "$PKG_NAME"
          mv "$PKG_NAME.tar.gz" "$GITHUB_WORKSPACE/"

      - name: Publish Web artifacts
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          prerelease: true
          files: |
            rustdesk-${{ env.VERSION }}-web-basic.tar.gz
